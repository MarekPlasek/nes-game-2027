MEMORY {
	# RAM
	ZP:			start = $0000, 	size = $100,	type = rw;	# 6502 zero-page
	BSS:		start = $0200,	size = $100;
	RAM:		start = $0300, 	size = $7F00; 	# CPU RAM

	# ROM
	HEADER:		start = $0, 	size = $10,		fill = yes, 	file = %O;	# NES 2.0 header
	PRG:		start = $8000, 	size = $8000,	fill = yes, 	file = %O;	# Program ROM
	CHR:		start = $0,		size = $2000,					file = %O;	# Character ROM
}

SEGMENTS {
	HEADER:		load = HEADER,	type = ro;
	STARTUP:	load = PRG,		type = ro;
	CODE:		load = PRG,		type = ro;
	RODATA:		load = PRG,		type = ro;
	DATA:     	load = PRG,		type = rw,							run = RAM,		define = yes;
	CHARS: 		load = CHR,		type = ro;
	BSS:		load = RAM,		type = bss,											define = yes;
	HEAP:		load = RAM,		type = bss,															optional = yes;
	ZEROPAGE:	load = ZP,		type = zp;
	RAM:		load = RAM,		type = rw;
	SAMPLES:	load = PRG,		type = overwrite,	start = $f000,					define = yes;
	VECTORS:	load = PRG,		type = overwrite,	start = $fffa;
}

SYMBOLS {
	NES_MAPPER:		type = weak,	value = 0;	# Mapper index according to the iNES specification, 0 = NROM
	NES_PRG_BANKS:	type = weak,	value = 2;	# 16K PRG bank count;
	NES_CHR_BANKS:	type = weak,	value = 1;	# 8K CHR bank count;
	NES_MIRRORING:	type = weak,	value = 1;	# 0 = horizontal, 1 = vertical, 8 = four screen

	__ARG_STACK_START__:	type = weak,	value = $0700;
	__ARG_STACK_SIZE__:		type = weak,	value = $100;
}
